<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ============================================================
         PAGE TITLE, DESCRIPTION & SOCIAL SHARING
         These are what Google and WhatsApp/Instagram/X show when
         someone shares your link. After you deploy, replace every
         "YOUR-DOMAIN.com" below with your real web address.
         ============================================================ -->
    <title>Abelito.Visuals | Graphic Design Portfolio, Kenya</title>
    <meta
      name="description"
      content="Abelito.Visuals is an independent graphic design brand in Kenya creating bold posters, social media graphics, brand identities, campaign artwork and motion graphics."
    />
    <meta name="theme-color" content="#2457FF" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abelito.Visuals" />
    <meta property="og:title" content="Abelito.Visuals | Good design gets noticed." />
    <meta
      property="og:description"
      content="Bold visuals, thoughtful design, and creative ideas built to make brands stand out."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abelito.Visuals | Good design gets noticed." />
    <meta
      name="twitter:description"
      content="Bold visuals, thoughtful design, and creative ideas built to make brands stand out."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts (both are free, open-licence fonts from Google Fonts):
         Bricolage Grotesque = headlines, DM Sans = body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Abelito.Visuals needs JavaScript switched on to show this portfolio.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
